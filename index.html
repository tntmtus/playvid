<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Platform Streaming Video Publik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SCRIPT IKLAN ADSTERRA: POPUNDER -->
    <script src="https://pl29865412.profitableratecpmnetwork.com/1a/a3/b4/1aa3b4e9aed326eb64deaa55c3d3d65f.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="#" class="flex items-center space-x-2">
                    <div class="bg-red-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <span class="text-xl font-bold tracking-wider text-white">Stream<span class="text-red-600">Flix</span></span>
                </a>
            </div>

            <!-- IKLAN BANNER ADSTERRA DI TENGAH NAVBAR / HEADER -->
            <div class="hidden lg:flex items-center justify-center">
                <script>
                  atOptions = {
                    'key' : '81fc184a99e98108ffe9b945401deffd',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                  };
                </script>
                <script src="https://aboardpoodlechat.com/81fc184a99e98108ffe9b945401deffd/invoke.js"></script>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="openUploadModal()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-full text-sm font-medium transition flex items-center space-x-2 cursor-pointer">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">Upload</span>
                </button>
                
                <!-- TOMBOL / STATUS LOGIN -->
                <div id="authContainer">
                    <button onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-full text-xs font-medium transition cursor-pointer">
                        <i class="fa-solid fa-user-lock mr-1"></i> Admin Login
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- AREA IKLAN BANNER TAMBAHAN (CONTAINER) -->
        <div class="mb-6 flex justify-center">
            <div id="container-2ea89d7d328592537abe3aadbf36723a"></div>
            <script async="async" data-cfasync="false" src="https://aboardpoodlechat.com/2ea89d7d328592537abe3aadbf36723a/invoke.js"></script>
        </div>

        <!-- VIDEO GRID SECTION -->
        <section>
            <h2 class="text-xl font-bold mb-6 flex items-center space-x-2">
                <i class="fa-solid fa-fire text-red-500"></i>
                <span>Video Publik Terbaru</span>
            </h2>

            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Video dimuat otomatis lewat JS -->
            </div>
        </section>
    </main>

    <!-- MODAL PEMUTAR VIDEO -->
    <div id="playerModal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700">
                <h3 id="playerTitle" class="text-lg font-bold text-white">Judul Video</h3>
                <button onclick="closePlayerModal()" class="text-slate-400 hover:text-white transition cursor-pointer text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 bg-black aspect-video flex items-center justify-center">
                <video id="videoPlayerElement" controls class="w-full h-full max-h-[500px]">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </div>

    <!-- MODAL UPLOAD VIDEO -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700">
                <h3 class="text-lg font-bold text-white">Upload Video ke Server</h3>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-white transition cursor-pointer"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="uploadForm" onsubmit="handleUpload(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Pilih File Video</label>
                    <input type="file" id="videoFile" accept="video/*" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-red-600 file:text-white hover:file:bg-red-75 cursor-pointer">
                </div>
                <div class="pt-2 flex justify-end space-x-3">
                    <button type="button" onclick="closeUploadModal()" class="bg-slate-700 text-white px-4 py-2 rounded-lg text-sm">Batal</button>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg text-sm">Publikasikan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL LOGIN ADMIN -->
    <div id="loginModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4">Login Admin</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Password Admin</label>
                    <input type="password" id="adminPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-sm text-white focus:outline-none focus:border-red-500" placeholder="Masukkan password...">
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeLoginModal()" class="bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs">Batal</button>
                    <button type="submit" class="bg-red-600 text-white px-4 py-1.5 rounded-lg text-xs font-medium">Masuk</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        const API_URL = '';
        let isAdmin = localStorage.getItem('isAdmin') === 'true';

        window.onload = function() {
            updateAuthUI();
            fetchVideos();
        };

        function updateAuthUI() {
            const authContainer = document.getElementById('authContainer');
            if (isAdmin) {
                authContainer.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-emerald-400 font-semibold bg-emerald-950/50 border border-emerald-800 px-2.5 py-1 rounded-full"><i class="fa-solid fa-shield-halved"></i> Admin</span>
                        <button onclick="handleLogout()" class="text-slate-400 hover:text-red-400 text-xs cursor-pointer" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;
            } else {
                authContainer.innerHTML = `
                    <button onclick="openLoginModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-3 py-2 rounded-full text-xs font-medium transition cursor-pointer">
                        <i class="fa-solid fa-user-lock mr-1"></i> Admin Login
                    </button>
                `;
            }
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassword').value;
            // Ganti 'admin123' dengan password bebas pilihan Anda
            if (pass === 'admin123') {
                isAdmin = true;
                localStorage.setItem('isAdmin', 'true');
                closeLoginModal();
                updateAuthUI();
                fetchVideos();
                alert('Berhasil login sebagai Admin!');
            } else {
                alert('Password salah!');
            }
        }

        function handleLogout() {
            isAdmin = false;
            localStorage.removeItem('isAdmin');
            updateAuthUI();
            fetchVideos();
            alert('Berhasil logout.');
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }
        function closePlayerModal() {
            const modal = document.getElementById('playerModal');
            const videoElem = document.getElementById('videoPlayerElement');
            videoElem.pause();
            videoElem.src = "";
            modal.classList.add('hidden');
        }

        function playVideo(title, url) {
            document.getElementById('playerTitle').innerText = title;
            const videoElem = document.getElementById('videoPlayerElement');
            videoElem.src = url;
            document.getElementById('playerModal').classList.remove('hidden');
            videoElem.play();
        }

        async function handleUpload(e) {
            e.preventDefault();
            const fileInput = document.getElementById('videoFile');
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('video', fileInput.files[0]);
                try {
                    const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
                    const result = await res.json();
                    if (res.ok) {
                        alert('Video berhasil di-upload!');
                        closeUploadModal();
                        fetchVideos();
                    } else {
                        alert('Gagal: ' + result.message);
                    }
                } catch (err) { alert('Terjadi kesalahan koneksi.'); }
            }
        }

        async function deleteVideo(filename, event) {
            event.stopPropagation(); // Mencegah video terputar saat tombol hapus diklik
            if (confirm(`Yakin ingin menghapus video ${filename}?`)) {
                try {
                    const res = await fetch(`${API_URL}/delete/${filename}`, { method: 'DELETE' });
                    const result = await res.json();
                    if (res.ok) {
                        alert('Video berhasil dihapus.');
                        fetchVideos();
                    } else {
                        alert('Gagal menghapus: ' + result.message);
                    }
                } catch (err) { alert('Kesalahan koneksi saat menghapus.'); }
            }
        }

        async function fetchVideos() {
            try {
                const res = await fetch(`${API_URL}/videos`);
                const videos = await res.json();
                const videoGrid = document.getElementById('videoGrid');
                videoGrid.innerHTML = '';

                if (videos.length === 0) {
                    videoGrid.innerHTML = '<p class="text-slate-400 text-sm col-span-full">Belum ada video yang di-upload.</p>';
                    return;
                }

                videos.forEach(video => {
                    const newCard = document.createElement('div');
                    newCard.className = "group cursor-pointer bg-slate-800/50 rounded-xl overflow-hidden border border-slate-800 hover:border-slate-700 transition";
                    newCard.onclick = () => playVideo(video.name, video.url);

                    let deleteButtonHTML = '';
                    if (isAdmin) {
                        deleteButtonHTML = `
                            <button onclick="deleteVideo('${video.name}', event)" class="absolute top-2 left-2 bg-red-600/90 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded-md shadow transition flex items-center space-x-1 cursor-pointer">
                                <i class="fa-solid fa-trash"></i> <span>Hapus</span>
                            </button>
                        `;
                    }

                    newCard.innerHTML = `
                        <div class="relative bg-slate-900 aspect-video flex items-center justify-center overflow-hidden">
                            <i class="fa-solid fa-play text-3xl text-slate-500 group-hover:text-red-500 group-hover:scale-110 transition duration-300"></i>
                            <span class="absolute bottom-2 right-2 bg-red-600 text-white text-xs px-2 py-0.5 rounded font-mono">Publik</span>
                            ${deleteButtonHTML}
                        </div>
                        <div class="p-3">
                            <h3 class="font-semibold text-white group-hover:text-red-400 transition line-clamp-1 text-sm">${video.name}</h3>
                            <p class="text-xs text-slate-400 mt-1">StreamFlix Server</p>
                        </div>
                    `;
                    videoGrid.appendChild(newCard);
                });
            } catch (err) {
                console.error('Gagal memuat video:', err);
            }
        }
    </script>
</body>
</html>
